<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Insumos</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="../css/styles.css" />

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" defer></script>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light navbar-biblioteca">
        <div class="container-fluid px-4">

            <!-- Logo y nombre -->
            <a class="navbar-brand d-flex align-items-center" href="home.html">
                <img src="../multimedia/logo.png" alt="Logo Biblioteca" class="logo-navbar me-2">
                <span>Biblioteca ISFT Nº12</span>
            </a>

            <!-- Botón responsive -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menú -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-lg-center">

                    <li class="nav-item">
                        <a class="nav-link" href="home.html" id="linkInicio">
                            <i class="bi bi-house-door"></i>
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="prestamos.html" id="linkPrestamos">
                            <i class="bi bi-arrow-left-right"></i>
                            Préstamos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="insumos.html" id="linkInsumos">
                            <i class="bi bi-box-seam"></i>
                            Insumos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="usuarios.html" id="linkUsuarios">
                            <i class="bi bi-people"></i>
                            Usuarios
                        </a>
                    </li>

                    <li class="nav-item ms-lg-2">
                        <a class="nav-link nav-link-salir" href="../index.html" id="linkIndex">
                            <i class="bi bi-box-arrow-right"></i>
                            Salir
                        </a>
                    </li>

                </ul>
            </div>

        </div>
    </nav>

    <!-- Contenido principal -->
    <div class="container mt-5">
        <div class="text-center mb-4">
            <h2 class="fw-bold">
                <img src="../multimedia/logo i12 fondo blanco.png" alt="Logo" class="d-inline-block align-text-top me-2"
                    style="height: 40px" />
                Gestión de Insumos
            </h2>
        </div>

        <!-- Barra de búsqueda y botón -->
        <div class="row mb-3">
            <div class="col-md-5 mb-3">
                <input type="text" class="form-control" id="inputBuscar" placeholder="Buscar insumo por nombre..." />
            </div>
            <div class="col-md-7 text-md-end text-center">
                <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#modalNuevoInsumo">
                    <i class="bi bi-plus-circle-fill"></i> Nuevo Insumo
                </button>
            </div>
        </div>

        <!-- Tabla -->
        <div class="table-responsive mt-4">
            <table id="insumosTabla" class="table align-middle">
                <thead>
                    <tr>
                        <th>N.º Inventario</th>
                        <th>Nombre</th>
                        <th>Observación</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="insumosTablaBody">

                </tbody>
            </table>
        </div>


        <!-- MODAL NUEVO INSUMO -->
        <div class="modal fade" id="modalNuevoInsumo" tabindex="-1" aria-labelledby="modalNuevoInsumoLabel"
            aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalNuevoInsumoLabel">
                            Registrar Nuevo Insumo
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <form class="row g-3" id="registroInsumo">

                            <!-- Fila 1: Nombre + Numeración inicial -->
                            <div class="col-md-8">
                                <label for="nombre" class="form-label fw-bold">Nombre</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-tag"></i></span>
                                    <input type="text" class="form-control" id="nombre" maxlength="20" required />
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label for="numeracion" class="form-label fw-bold">Numeración inicial</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-list-ol"></i></span>
                                    <input type="number" class="form-control" id="numeracion" min="1" />
                                </div>
                            </div>

                            <!-- Fila 2: N.º Inventario + Cantidad -->
                            <div class="col-md-7">
                                <label for="numeroInventario" class="form-label fw-bold">Número de inventario</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-hash"></i></span>
                                    <input type="text" class="form-control" id="numeroInventario" maxlength="10"
                                        required />
                                </div>
                            </div>
                            <div class="col-md-5">
                                <label for="cantidad" class="form-label fw-bold">Cantidad</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-123"></i></span>
                                    <input type="number" class="form-control" id="cantidad" value="1" min="1" max="50"
                                        required />
                                </div>
                                <div class="form-text">Se generará un insumo por cada unidad</div>
                            </div>

                            <!-- Divisor -->
                            <div class="col-12">
                                <hr class="my-2">
                                <small class="text-muted fw-bold">DETALLES ADICIONALES</small>
                            </div>

                            <!-- Observación -->
                            <div class="col-12">
                                <label for="observacion" class="form-label fw-bold">Observación</label>
                                <textarea class="form-control" id="observacion" rows="3" maxlength="30"></textarea>
                            </div>

                        </form>
                    </div>
                    <div class="modal-footer border-0 justify-content-center pt-0">
                        <button type="submit" class="btn btn-danger" form="registroInsumo">
                            Guardar Insumo(s)
                        </button>
                    </div>

                </div>
            </div>
        </div>

        <!-- MODAL EDITAR INSUMO -->
        <div class="modal fade" id="modalEditarInsumo" tabindex="-1" aria-labelledby="modalEditarInsumoLabel"
            aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalEditarInsumoLabel">
                            Editar Insumo
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <form class="row g-3" id="formEditarInsumo">
                            <input type="hidden" id="editCodigo" />
                            <div class="col-12">
                                <label for="editNombre" class="form-label fw-bold">Nombre</label>
                                <input type="text" class="form-control" id="editNombre" maxlength="20" required />
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-bold">Estado</label>
                                <select class="form-select" id="editEstado" required>
                                    <option value="Disponible">Disponible</option>
                                    <option value="No Disponible">No Disponible</option>
                                    <!--<option value="En Reparación">En Reparación</option>-->
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-bold">Observación</label>
                                <textarea class="form-control" id="editObservacion" rows="3" maxlength="30"></textarea>
                            </div>
                            <div class="mt-4 d-flex justify-content-center">
                                <button type="submit" class="btn btn-danger me-2" id="submitEditar">
                                    Guardar cambios
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Scripts -->
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script src="../scripts/insumos.js" type="module"></script>
        <script src="../scripts/funciones.js" type="module"></script>

</body>

</html>
