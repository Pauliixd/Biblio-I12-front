<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Usuarios - Gestión de Usuarios
  </title>


  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >


  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
  >


  <!-- CSS propio -->
  <link
    rel="stylesheet"
    href="../css/styles.css"
  >

</head>


<body>


  <!-- =====================================================
       NAVBAR
  ====================================================== -->

  <nav class="navbar navbar-expand-lg navbar-light navbar-biblioteca">
  <div class="container-fluid px-4">

    <!-- Logo y nombre -->
    <a class="navbar-brand d-flex align-items-center" href="home.html">
      <img 
        src="../multimedia/logo.png" 
        alt="Logo Biblioteca" 
        class="logo-navbar me-2"
      >
      <span>Biblioteca ISFT Nº12</span>
    </a>

    <!-- Botón responsive -->
    <button 
      class="navbar-toggler" 
      type="button" 
      data-bs-toggle="collapse" 
      data-bs-target="#navbarNav"
      aria-controls="navbarNav" 
      aria-expanded="false" 
      aria-label="Abrir menú"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Menú -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto align-items-lg-center">

        <li class="nav-item">
          <a class="nav-link" href="home.html" id="linkInicio">
            <i class="bi bi-house-door"></i>
            Inicio
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="prestamos.html" id="linkPrestamos">
            <i class="bi bi-arrow-left-right"></i>
            Préstamos
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="insumos.html" id="linkInsumos">
            <i class="bi bi-box-seam"></i>
            Insumos
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="usuarios.html" id="linkUsuarios">
            <i class="bi bi-people"></i>
            Usuarios
          </a>
        </li>

        <li class="nav-item ms-lg-2">
          <a class="nav-link nav-link-salir" href="../index.html" id="linkIndex">
            <i class="bi bi-box-arrow-right"></i>
            Salir
          </a>
        </li>

      </ul>
    </div>

  </div>
</nav>



  <!-- =====================================================
       CONTENIDO
  ====================================================== -->

  <div class="container mt-5">


    <!-- TÍTULO -->

    <div class="text-center mb-4">

      <h2 class="fw-bold">

        <img
          src="../multimedia/logo i12 fondo blanco.png"
          alt="Logo"
          class="d-inline-block align-text-top me-2"
          style="height: 40px"
        >

        Gestión de Usuarios

      </h2>

    </div>



    <!-- ===================================================
         BOTÓN NUEVO USUARIO
    ==================================================== -->

    <div class="row mb-3">

      <div class="col-md-5 mb-3">
      </div>


      <div
        class="col-md-7 text-md-end text-center"
      >

        <button
          class="btn btn-danger"
          data-bs-toggle="modal"
          data-bs-target="#modalAltaUsuario"
        >

          <i class="bi bi-person-plus"></i>

          Nuevo Usuario

        </button>

      </div>

    </div>



    <!-- ===================================================
         TABLA DE USUARIOS
    ==================================================== -->

    <div class="table-responsive mt-4">

      <table class="table align-middle">

        <thead>

          <tr>

            <th>
              Nombre y Apellido
            </th>

            <th>
              DNI
            </th>

            <th>
              Email
            </th>

            <th>
              Cargo
            </th>

            <th class="text-center">
              Acciones
            </th>

          </tr>

        </thead>


        <tbody id="usuariosTableBody">
        </tbody>

      </table>

    </div>

  </div>



  <!-- =====================================================
       MODAL EDITAR USUARIO
  ====================================================== -->

  <div
    class="modal fade"
    id="modalEditarUsuario"
    tabindex="-1"
    aria-labelledby="modalEditarUsuarioLabel"
    aria-hidden="true"
  >

    <div
      class="modal-dialog modal-dialog-centered"
    >

      <div class="modal-content">


        <!-- HEADER -->

        <div class="modal-header">

          <h5
            class="modal-title"
            id="modalEditarUsuarioLabel"
          >
            Editar Usuario
          </h5>


          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Cerrar"
          ></button>

        </div>



        <!-- BODY -->

        <div class="modal-body">

          <form
            class="row g-3"
            id="formEditarUsuario"
          >


            <!-- DNI -->

            <input
              type="hidden"
              id="editCodigo"
            >



            <!-- NOMBRE Y APELLIDO -->

            <div class="col-12">

              <label
                for="editNombreYApellido"
                class="form-label fw-bold"
              >
                Nombre y Apellido
              </label>


              <input
                type="text"
                class="form-control"
                id="editNombreYApellido"
                maxlength="50"
                required
              >

            </div>



            <!-- CARGO -->

            <div class="col-12">

              <label
                for="editCargo"
                class="form-label fw-bold"
              >
                Cargo
              </label>


              <select
                class="form-select"
                id="editCargo"
                required
              >

                <option
                  value=""
                  disabled
                >
                  Seleccionar cargo
                </option>


                <option value="1">
                  Administrador
                </option>


                <option value="2">
                  Bibliotecario
                </option>


                <option value="3">
                  Secretario
                </option>

              </select>

            </div>



            <!-- EMAIL -->

            <div class="col-12">

              <label
                for="editEmail"
                class="form-label fw-bold"
              >
                Email
              </label>


              <input
                type="email"
                class="form-control"
                id="editEmail"
                required
              >

            </div>



            <!-- CONTRASEÑA -->

            <div class="col-12">

              <label
                for="editPasswordSystem"
                class="form-label fw-bold"
              >
                Nueva contraseña
              </label>


              <input
                type="password"
                class="form-control"
                id="editPasswordSystem"
                placeholder="Dejar vacío para mantener la actual"
              >

              <div class="form-text">

                Si no querés cambiar la contraseña,
                dejá este campo vacío.

              </div>

            </div>



            <!-- BOTÓN GUARDAR -->

            <div
              class="mt-4 d-flex justify-content-center"
            >

              <button
                type="submit"
                class="btn btn-danger"
                id="submitEditarUsuario"
              >

                <i class="bi bi-check-lg"></i>

                Guardar cambios

              </button>

            </div>


          </form>

        </div>

      </div>

    </div>

  </div>



  <!-- =====================================================
       MODAL ALTA USUARIO
  ====================================================== -->

  <div
    class="modal fade"
    id="modalAltaUsuario"
    tabindex="-1"
    aria-labelledby="modalAltaUsuarioLabel"
    aria-hidden="true"
  >

    <div
      class="modal-dialog modal-dialog-centered modal-lg"
    >

      <div
        class="modal-content border-0 shadow-lg rounded-4"
      >


        <!-- HEADER -->

        <div
          class="modal-header bg-rojo-suave rounded-top-4"
        >

          <h5
            class="modal-title d-flex align-items-center gap-2"
            id="modalAltaUsuarioLabel"
          >

            <img
              src="../multimedia/logo.png"
              alt="Logo"
              style="height: 40px"
              class="rounded"
            >

            <span class="fw-semibold">
              Alta de Usuario
            </span>

          </h5>


          <button
            type="button"
            class="btn-close btn-close-white"
            data-bs-dismiss="modal"
            aria-label="Cerrar"
          ></button>

        </div>



        <!-- BODY -->

        <div
          class="modal-body p-4 bg-light-subtle"
        >

          <form
            id="altaUsuarioForm"
            class="needs-validation"
            novalidate
          >

            <div class="row g-3">


              <!-- NOMBRE -->

              <div class="col-md-6">

                <label
                  for="nombreYApellido"
                  class="form-label fw-semibold"
                >
                  Apellido y Nombre
                </label>


                <input
                  type="text"
                  class="form-control border-secondary-subtle"
                  id="nombreYApellido"
                  placeholder="Ej: García Sofía"
                  maxlength="50"
                  required
                >

              </div>



              <!-- DNI -->

              <div class="col-md-6">

                <label
                  for="dni"
                  class="form-label fw-semibold"
                >
                  DNI
                </label>


                <input
                  type="number"
                  class="form-control border-secondary-subtle"
                  id="dni"
                  placeholder="Sin puntos ni espacios"
                  required
                >

              </div>



              <!-- EMAIL -->

              <div class="col-md-6">

                <label
                  for="email"
                  class="form-label fw-semibold"
                >
                  Email
                </label>


                <input
                  type="email"
                  class="form-control border-secondary-subtle"
                  id="email"
                  placeholder="usuario@ejemplo.com"
                  required
                >

              </div>



              <!-- CARGO -->

              <div class="col-md-6">

                <label
                  for="cargo"
                  class="form-label fw-semibold"
                >
                  Cargo
                </label>


                <select
                  class="form-select border-secondary-subtle"
                  id="cargo"
                  required
                >

                  <option
                    value=""
                    selected
                    disabled
                  >
                    Seleccionar
                  </option>


                  <option value="1">
                    Administrador
                  </option>


                  <option value="2">
                    Bibliotecario
                  </option>


                  <option value="3">
                    Secretario
                  </option>

                </select>

              </div>



              <!-- CONTRASEÑA -->

              <div class="col-md-6">

                <label
                  for="altaPassword"
                  class="form-label fw-semibold"
                >
                  Contraseña
                </label>


                <input
                  type="password"
                  class="form-control border-secondary-subtle"
                  id="altaPassword"
                  placeholder="Contraseña"
                  required
                >

              </div>



              <!-- BOTÓN CREAR -->

              <div class="text-center mt-4">

                <button
                  type="submit"
                  class="btn btn-rojo-suave px-5 py-2 rounded-pill shadow-sm"
                >

                  <i class="bi bi-person-plus"></i>

                  Crear Usuario

                </button>

              </div>



              <!-- MENSAJE -->

              <div class="mt-3 text-center">

                <p
                  id="mensaje"
                  class="text-danger fw-semibold"
                ></p>

              </div>


            </div>

          </form>

        </div>

      </div>

    </div>

  </div>



  <!-- =====================================================
       SCRIPTS
  ====================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/sweetalert2@11"
  ></script>


  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
  ></script>


  <!-- Alta de usuario -->
  <script
    type="module"
    src="../scripts/altaUser.js"
  ></script>


  <!-- Usuarios -->
  <script
    type="module"
    src="../scripts/usuarios.js"
  ></script>
  <script src="../scripts/funciones.js" type="module"></script>



</body>

</html>
